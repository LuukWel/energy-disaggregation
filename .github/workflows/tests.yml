name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies and the package
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      # The tests use synthetic data only; the Belkin dataset is not needed.
      - name: Run tests
        run: pytest
      - name: Data dictionary is up to date
        run: |
          python -m nilm.schema docs/data_dictionary.md
          git diff --exit-code docs/data_dictionary.md
